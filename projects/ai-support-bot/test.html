<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Support Bot | n8n Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .subtitle {
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 32px;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-main);
            font-weight: 500;
            font-size: 0.9rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
        }

        .examples {
            margin-top: 32px;
        }

        .examples-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chip:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
        }

        #result-container {
            margin-top: 32px;
            display: none;
            padding: 24px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 16px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #answerArea {
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 1.05rem;
        }

        .meta {
            display: flex;
            gap: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .meta-value {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-state {
            background: rgba(239, 68, 68, 0.1) !important;
            border-color: rgba(239, 68, 68, 0.2) !important;
        }

        .error-state .result-header {
            color: #ef4444;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>n8n Support Bot</h1>
        <p class="subtitle">AI-powered automation with OpenRouter & Google Sheets</p>

        <div class="input-group">
            <label for="question">How can we help you today?</label>
            <input type="text" id="question" placeholder="Ask anything about your account, billing...">
        </div>

        <button id="submitBtn" onclick="testBot()">
            <span id="btnText">Send Inquiry</span>
            <div id="loader" class="loader"></div>
        </button>

        <div id="result-container">
            <div class="result-header">✨ AI Response</div>
            <p id="answerArea"></p>
            <div class="meta">
                <div class="meta-item">
                    <span class="meta-label">Category</span>
                    <span class="meta-value" id="categoryTag"></span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">Sentiment</span>
                    <span class="meta-value" id="sentimentTag"></span>
                </div>
            </div>
        </div>

        <div class="examples">
            <p class="examples-title">Quick Try</p>
            <div class="chips">
                <div class="chip" onclick="autoFill('How do I reset my password?')">Reset Password</div>
                <div class="chip" onclick="autoFill('What are your subscription plans?')">Pricing Plans</div>
                <div class="chip" onclick="autoFill('Is there a mobile app available?')">Mobile App</div>
            </div>
        </div>
    </div>
</div>

<script>
    const WEBHOOK_URL = 'http://localhost:5678/webhook-test/customer-support';

    function autoFill(text) {
        document.getElementById('question').value = text;
        document.getElementById('question').focus();
    }

    async function testBot() {
        const questionInput = document.getElementById('question');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');
        const resultContainer = document.getElementById('result-container');
        const answerArea = document.getElementById('answerArea');
        const categoryTag = document.getElementById('categoryTag');
        const sentimentTag = document.getElementById('sentimentTag');

        const questionValue = questionInput.value.trim();

        if (!questionValue) return;

        // UI State: Loading
        submitBtn.disabled = true;
        btnText.style.display = 'none';
        loader.style.display = 'block';
        resultContainer.style.display = 'none';
        resultContainer.classList.remove('error-state');

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: questionValue })
            });

            if (!response.ok) throw new Error('Workflow not running');

            const data = await response.json();

            answerArea.innerText = data.answer || "Success! The workflow processed your request.";
            categoryTag.innerText = data.category || "General";
            sentimentTag.innerText = data.sentiment || "Neutral";
            
            resultContainer.style.display = 'block';

        } catch (error) {
            resultContainer.classList.add('error-state');
            document.querySelector('.result-header').innerText = "⚠️ Connection Error";
            answerArea.innerText = "Could not connect to n8n. Please ensure your workflow is in 'Execute' mode and the webhook URL is correct.";
            categoryTag.innerText = "N/A";
            sentimentTag.innerText = "N/A";
            resultContainer.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
            btnText.style.display = 'block';
            loader.style.display = 'none';
        }
    }
</script>

</body>
</html>
